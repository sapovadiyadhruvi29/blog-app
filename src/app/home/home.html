<div class="container">
  <h1>Blog Posts</h1>

  <button routerLink="/add">➕ Add Post</button>

  <div class="card-container">
    <div class="card" *ngFor="let post of posts">
      <h2>{{post.title}}</h2>
      <p>{{post.desc}}</p>

      <a [routerLink]="['/post', post.id]">View</a>
      <a [routerLink]="['/edit', post.id]">Edit</a>
      <button (click)="delete(post.id)">Delete</button>
    </div>
  </div>
</div>
