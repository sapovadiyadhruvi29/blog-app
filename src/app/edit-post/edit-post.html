<div class="post-page">
  <div class="post-box">
    <h2>Edit Post</h2>

    <div class="input-group">
      <label>Title</label>
      <input type="text" [(ngModel)]="post.title">
    </div>

    <div class="input-group">
      <label>Description</label>
      <textarea rows="6" [(ngModel)]="post.desc"></textarea>
    </div>

    <button (click)="updatePost()">Update Post</button>
  </div>
</div>
