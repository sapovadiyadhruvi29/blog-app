<div class="page">

  <div class="card">

    <h1>Join Medium.</h1>

    <button class="btn">
      <img src="https://img.icons8.com/color/20/google-logo.png">
      Sign up with Google
    </button>

    <button class="btn">
      <img src="https://img.icons8.com/color/20/facebook.png">
      Sign up with Facebook
    </button>

    <button class="btn">
      <img src="https://img.icons8.com/ios-filled/20/000000/new-post.png">
      Sign up with email
    </button>

    <div class="remember">
      <input type="checkbox" checked>
      <label>Remember me for faster sign in</label>
    </div>

    <p class="signin">
      Already have an account? <a href="#">Sign in</a>
    </p>

    <p class="terms">
      By clicking "Sign up", you accept Terms & Privacy Policy.
    </p>

  </div>

</div>
