<div class="postdetails">
  <div class="post">
    <h2>Add New Post</h2>

    <form>
      <div>
        <label><b>Title :</b></label>
        <input type="text" name="title" [(ngModel)]="title" placeholder="Enter post title">
      </div><br>

      <div>
        <label><b>Author Name :</b></label>
        <input type="text" name="author" [(ngModel)]="author" placeholder="Enter author name">
      </div><br>

      <div>
        <label><b>Description:</b></label>
        <textarea name="description" rows="4" [(ngModel)]="description" placeholder="Write your post here.."></textarea>
      </div><br>

      <button (click)="addPost()">Save</button>
    </form>
  </div>
</div>
