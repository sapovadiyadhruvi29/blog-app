<div class="post-page">
  <div class="post-box">
    <h2>Add New Post</h2>

    <div class="input-group">
      <label>Title</label>
      <input type="text" [(ngModel)]="title" placeholder="Enter post title">
    </div>

    <div class="input-group">
      <label>Description</label>
      <textarea rows="6" [(ngModel)]="desc" placeholder="Write your post"></textarea>
    </div>

    <button (click)="addPost()">Add Post</button>
  </div>
</div>
